version: "3"

services:
  superset:
    # volumes:
    #   - ./superset_chat/app:/app/app
    #   - ./superset_chat/templates:/app/templates
    #   - ./superset_chat/ai_superset_assistant.py:/app/ai_superset_assistant.py
    env_file:
      - .env
    networks:
      data-lake-network:
    build:
      context: superset
      dockerfile: Dockerfile
    container_name: superset
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: postgres
      DATABASE_USER: postgres
      ADMIN_PASSWORD: superset
      DATABASE_PASSWORD: postgres
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s


  superset-importer:
    env_file:
      - superset/superset.env
    build:
      context: superset/imports
      dockerfile: Dockerfile
    container_name: superset-importer
    networks:
      - data-lake-network
    depends_on:
      superset:
        condition: service_healthy
    restart: "no"

  # Built-in Superset mcp_service over streamable-http (roadmap #19) — the
  # RBAC-enforced, fail-closed migration target instead of the alpha
  # superset-mcp-server. Select it from the plugin with:
  #   TRANSPORT_TYPE=streamable_http
  #   mcp_host=mcp_service:5008
  #   SUPERSET_API_KEY=sst-...        (preferred; or MCP_TOKEN=<jwt>)
  # NOTE: requires a Superset image that ships the mcp_service CLI
  # (`superset mcp run`); apache/superset:4.1.1 may not — point the build at a
  # Superset version that has it (e.g. the /home/mlfts/superset build).
  mcp_service:
    env_file:
      - .env
    build:
      context: superset
      dockerfile: Dockerfile
    container_name: mcp_service
    command: ["superset", "mcp", "run", "--host", "0.0.0.0", "--port", "5008"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    networks:
      - data-lake-network
    ports:
      - "5008:5008"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost',5008),5).close()\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    networks:
      data-lake-network:
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/db-files/
      POSTGRES_MULTIPLE_DATABASES: superset,postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data/db-files
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5

  falkordb:
    container_name: falkordb
    image: falkordb/falkordb:latest
    volumes:
      - ./falkordb_data:/var/lib/falkordb/data
    ports:
      - 3000:3000
      - 6379:6379
    restart: always
    networks:
      data-lake-network:
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost -p 6379 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  educational-dbt-docs:
    container_name: educational-dbt-docs
    ports:
      - "8502:80"
    build:
      context: ./DbtEducationalDataProject
      dockerfile: Dockerfile
    volumes:
      - ./DbtEducationalDataProject:/usr/app/dbt
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-lake-network
    environment:
      - DBT_PROFILES_DIR=/usr/app/dbt
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  dbt-graph-loader:
    container_name: dbt-graph-loader
    build:
      context: ./dbt-graph-loader
      dockerfile: Dockerfile
    volumes:
      - ./DbtEducationalDataProject:/dbt
    depends_on:
      falkordb:
        condition: service_healthy
      educational-dbt-docs:
        condition: service_healthy
    networks:
      - data-lake-network
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
    restart: "no"

networks:
  data-lake-network: 
